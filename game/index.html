<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>同一條街</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div id="tint"></div>
  <div id="vignette"></div>
  <div id="slate"></div>
  <div id="whispers"></div>
  <div id="labels"></div>
  <div id="area-label"></div>
  <div id="hud-clock"></div>
  <div id="hud"></div>
  <div id="blocked"></div>
  <div id="ff">▶▶ 快轉</div>
  <div id="chores-hud"></div>
  <div id="dialog"></div>
  <div id="choices"></div>
  <div id="hold"></div>
  <div id="bubbles"></div>
  <div id="fly"></div>
  <div id="fade"></div>
  <div id="caption"></div>
  <div id="title-card"></div>
  <div id="phone"></div>
  <div id="panel"></div>
  <div id="cite"></div>
  <div id="wip"></div>
  <div id="next-hint"></div>
  <div id="hint">WASD／方向鍵移動　Shift 快走　拖曳轉視角　滾輪縮放　F 全螢幕</div>
  <div id="touch-pad" aria-label="移動搖桿"><div id="touch-nub"></div></div>
  <button id="touch-act" type="button">按住<br>做家務</button>
  <button id="touch-menu" type="button" aria-label="選單">☰</button>
  <div id="rotate"><div><b>⟳</b><p>請把手機轉成橫的</p><small>轉不過來的話，先到控制中心關掉「直向鎖定」</small></div></div>
  <div id="presenter-timer"></div>
  <div id="menu"></div>
  <div id="qr"></div>
  <div id="toast"></div>
  <div id="pause-badge">暫停（P 繼續）</div>
  <div id="loading">載入中…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/live-config.js"></script>
<script src="js/live.js"></script>
<script src="js/sfx.js"></script>
<script src="js/art.js"></script>
<script src="js/characters.js"></script>
<script src="js/world.js"></script>
<script src="js/sets.js"></script>
<script src="js/post.js"></script>
<script src="js/env.js"></script>
<script src="js/rail.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui-panels.js"></script>
<script src="js/mechanics.js"></script>
<script src="js/scenes.js"></script>
<script src="js/presenter.js"></script>
<script src="js/main.js"></script>
</body>
</html>
